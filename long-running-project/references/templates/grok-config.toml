# Project-scoped Grok Build config (long-running defaults)
# Docs: https://docs.x.ai/build/features/permissions

[permission]
rules = [
  { action = "deny", tool = "bash", pattern = "rm -rf *" },
  { action = "deny", tool = "bash", pattern = "git push --force*" },
  { action = "deny", tool = "bash", pattern = "git push -f*" },
  { action = "deny", tool = "bash", pattern = "git reset --hard*" },
]

# Agent selection is session/user scoped, not project-config scoped:
#   grok --agent conductor
#   GROK_AGENT=conductor grok
