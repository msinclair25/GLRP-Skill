# Project-scoped Grok Build config (long-running defaults)
# Docs: ~/.grok/docs/user-guide/

[permission]
deny = [
  "Bash(rm -rf *)",
  "Bash(git push --force*)",
  "Bash(git push -f*)",
  "Bash(git reset --hard*)",
]

